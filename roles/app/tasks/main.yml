---
- name: Install application dependencies
  ansible.builtin.apt:
    name: "{{ app_packages }}"
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_root }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Deploy landing page
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ app_root }}/index.html"
    owner: www-data
    group: www-data
    mode: "0644"
