---
- name: Configure web servers
  hosts: webservers
  become: true
  roles:
    - { role: common, tags: [common] }
    - { role: nginx,  tags: [nginx] }
    - { role: app,    tags: [app] }

- name: Verify deployment
  hosts: webservers
  become: false
  gather_facts: false
  tags: [verify]
  tasks:
    - name: Check that Nginx responds on the health endpoint
      ansible.builtin.uri:
        url: "http://localhost:{{ nginx_http_port }}/health"
        status_code: 200
        return_content: true
      register: health
      retries: 5
      delay: 2
      until: health.status == 200

    - name: Show result
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} is healthy"
